name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_DISABLE_GUI_ERRORS: 1

jobs:
  documentation:
    name: Documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify local Markdown links
        shell: pwsh
        run: ./eng/verify-markdown-links.ps1
      - name: Verify headless managed workflow invocations
        shell: pwsh
        run: ./eng/verify-headless-workflows.ps1
      - name: Verify tracked project solution membership
        shell: pwsh
        run: ./eng/verify-solution-projects.ps1
      - name: Enforce the prerelease non-distribution boundary
        shell: pwsh
        run: ./eng/verify-prerelease-nondistribution.ps1
      - name: Verify the W8 local validator self-tests
        shell: pwsh
        run: ./eng/Invoke-W8LocalReleaseValidation.ps1 -SelfTest
      - name: Verify the deterministic W8 local validator plan
        shell: pwsh
        run: |
          $first = ./eng/Invoke-W8LocalReleaseValidation.ps1 -List | Out-String
          $second = ./eng/Invoke-W8LocalReleaseValidation.ps1 -List | Out-String
          if ($first -cne $second) {
            throw 'The W8 local release-validation plan is not deterministic.'
          }
          $plan = $first | ConvertFrom-Json
          if ($plan.commandCount -ne 22 -or $plan.requiredInputs.Count -ne 3 -or
              -not $plan.localOnly -or $plan.hostedEvidence -cne 'NotRun' -or $plan.closureClaim) {
            throw 'The W8 local release-validation plan has an unexpected scope or command inventory.'
          }

  fast:
    name: Build and fast tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet restore PhoenixInspect.sln --locked-mode
      - name: Build Release
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet build PhoenixInspect.sln --configuration Release --no-restore --verbosity minimal --maxcpucount:1 --disable-build-servers /p:UseSharedCompilation=false
      - name: Run semantic and differential tests
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet test tests/PhoenixInspect.Tests/PhoenixInspect.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal --logger "trx;LogFileName=unit.trx" --results-directory artifacts/ci-results/unit
      - name: Validate semantic and differential test evidence
        shell: pwsh
        run: ./eng/Invoke-W8LocalReleaseValidation.ps1 -ValidateTrxPath artifacts/ci-results/unit/unit.trx
      - name: Run non-dump adapter tests
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet test tests/PhoenixInspect.IntegrationTests/PhoenixInspect.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "Category!=Dump" --verbosity minimal --logger "trx;LogFileName=non-dump.trx" --results-directory artifacts/ci-results/non-dump
      - name: Validate non-dump adapter test evidence
        shell: pwsh
        run: ./eng/Invoke-W8LocalReleaseValidation.ps1 -ValidateTrxPath artifacts/ci-results/non-dump/non-dump.trx

  dump-evidence:
    name: Real dump evidence
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet restore PhoenixInspect.sln --locked-mode
      - name: Build Release
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet build PhoenixInspect.sln --configuration Release --no-restore --verbosity minimal --maxcpucount:1 --disable-build-servers /p:UseSharedCompilation=false
      - name: Generate and inspect a real dump
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet test tests/PhoenixInspect.IntegrationTests/PhoenixInspect.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "Category=Dump&Corpus!=ModeledIncidentContextV1" --verbosity normal --logger "trx;LogFileName=ordinary-dump.trx" --results-directory artifacts/ci-results/ordinary-dump
      - name: Validate real-dump test evidence
        shell: pwsh
        run: ./eng/Invoke-W8LocalReleaseValidation.ps1 -ValidateTrxPath artifacts/ci-results/ordinary-dump/ordinary-dump.trx

  preview-demo:
    name: Preview demo
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet restore PhoenixInspect.sln --locked-mode
      - name: Build Release
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet build PhoenixInspect.sln --configuration Release --no-restore --verbosity minimal --maxcpucount:1 --disable-build-servers /p:UseSharedCompilation=false
      # The demo is the preview's front door. Running it here means a broken demo fails the build rather than a
      # reader's first attempt. The transcript is retained so a failure can be read without reproducing the run.
      - name: Run the preview demo end to end
        run: ./eng/Invoke-PreviewDemo.ps1 -OutputDirectory ./artifacts/preview-demo -SkipBuild
      - name: Upload the demo transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-demo-transcript
          path: ./artifacts/preview-demo/demo-session.txt
          if-no-files-found: warn

  prerelease-artifacts:
    name: Local prerelease package validation (non-distributed)
    needs: [documentation, fast]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # This lane proves only that the two preview application payloads can be built, inventoried, hashed, archived,
      # and that the extracted CLI and Desktop pass bounded headless/non-UI smokes. Generated third-party evidence is
      # included, but human legal review is still pending. It does not distribute, sign, publish, or claim W8.10 closure.
      - name: Build and smoke-test the bounded win-x64 artifact set
        shell: pwsh
        run: ./eng/Publish-PrereleaseArtifacts.ps1 -OutputDirectory ./artifacts/prerelease

  optimized-context-evidence:
    name: Optimized Release context evidence
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet restore tests/PhoenixInspect.IntegrationTests/PhoenixInspect.IntegrationTests.csproj --locked-mode
      - name: Build optimized context evidence
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet build tests/PhoenixInspect.IntegrationTests/PhoenixInspect.IntegrationTests.csproj --configuration Release --no-restore --verbosity minimal --maxcpucount:1 --disable-build-servers /p:UseSharedCompilation=false
      - name: Measure the versioned optimized incident corpus
        run: ./eng/Invoke-HeadlessProcess.ps1 dotnet test tests/PhoenixInspect.IntegrationTests/PhoenixInspect.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "Category=Dump&Corpus=ModeledIncidentContextV1" --verbosity normal --logger "trx;LogFileName=optimized-context.trx" --results-directory artifacts/ci-results/optimized-context
      - name: Validate optimized-context test evidence
        shell: pwsh
        run: ./eng/Invoke-W8LocalReleaseValidation.ps1 -ValidateTrxPath artifacts/ci-results/optimized-context/optimized-context.trx
